version: '3.8'

services:
  backend:
    build: ./backend
    container_name: leetcode-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker   # optional
    networks:
      - leetcode-net

  frontend:
    build: ./frontend
    container_name: leetcode-frontend
    ports:
      - "4200:80"          # host:container
    depends_on:
      - backend
    networks:
      - leetcode-net

networks:
  leetcode-net:
    driver: bridge